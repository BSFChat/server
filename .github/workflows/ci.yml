name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bsfchat/server

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      # One configuration failing should not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            # -Wall -Wextra only. Deliberately NOT -Werror: several people
            # work in this tree at once and a warning introduced in one
            # branch must not block everyone else's builds. Warnings show up
            # as GitHub annotations on the diff, which is the point.
            cxx_flags: "-Wall -Wextra"
          - name: debug
            build_type: Debug
            cxx_flags: "-Wall -Wextra"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      - name: Build
        run: cmake --build build -j$(nproc)

      # -j: gtest_discover_tests registers every case as its own ctest
      # test, so this is also the check that fixtures stay parallel-safe
      # (unique temp dirs, ephemeral ports). Serial would hide a
      # regression back to shared paths.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev

      - name: Configure
        # -fno-omit-frame-pointer keeps the stack traces readable; -O1 keeps
        # the sanitized test run from taking all afternoon.
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure -j$(nproc)

  analyze:
    name: cppcheck
    runs-on: ubuntu-24.04
    # Advisory only for now — this is a new check against an existing
    # codebase, so it reports rather than gates. Tighten once the backlog it
    # surfaces has been worked through.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --std=c++20 \
                   --error-exitcode=1 \
                   -I src \
                   src/

  # ---------------------------------------------------------------------------
  # Release-channel script
  # ---------------------------------------------------------------------------
  # scripts/channel_tags.py decides which of :latest / :latest-beta a tag
  # takes, and getting it wrong silently downgrades every deployment
  # tracking stable. It runs on PRs too, so the rule is checked before the
  # tag that would exercise it is ever pushed.
  channels:
    name: channel rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test the channel rules
        run: python3 scripts/test_channel_tags.py

  # ---------------------------------------------------------------------------
  # Development image: tip of main
  # ---------------------------------------------------------------------------
  # :main is what :latest used to be — whatever landed last, unreviewed.
  # It is deliberately NOT :latest any more; see docs/release-channels.md.
  #
  # Single-arch (linux/amd64). Adding linux/arm64 here means QEMU-emulating
  # a full C++ build of this tree on every push, which costs roughly an
  # order of magnitude more runner time than it is worth. The way to do it
  # properly is a native arm64 runner and a manifest merge, not
  # `platforms:` on this step.
  docker:
    name: image (main)
    needs: [build, channels]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, so cmake/Version.cmake's `git describe`
          # fallback resolves to the last release rather than 0.0.0-dev.
          fetch-depth: 0

      - name: Derive a development version
        id: version
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          LAST="${LAST#v}"
          # -dev.<sha> sorts BELOW the release it is built on under semver
          # precedence, which is correct: this is main after that tag, and
          # it must never read as the tag itself.
          echo "version=${LAST%%-*}-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push :main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.revision }}
          build-args: |
            BSFCHAT_SERVER_VERSION=${{ steps.version.outputs.version }}
            BSFCHAT_SERVER_REVISION=${{ steps.version.outputs.revision }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Release: tag push
  # ---------------------------------------------------------------------------
  # Builds ONCE and pushes that one image under every tag it earns. The
  # channel assignment is ours (scripts/channel_tags.py) rather than
  # metadata-action's `type=semver`, because only ours can see the other
  # tags in the repository — which is the whole point: :latest follows the
  # HIGHEST stable version, so a hotfix cut on an older line does not drag
  # it backwards.
  release:
    name: release (${{ github.ref_name }})
    needs: [build, channels]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # creating the GitHub Release
      packages: write   # pushing to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          # Every v* tag has to be present locally or the comparison is
          # made against an empty set and every tag looks like the newest.
          fetch-depth: 0

      - name: Compute channel tags
        id: channel
        run: |
          python3 scripts/channel_tags.py \
            --tag "${GITHUB_REF_NAME}" \
            --image "${REGISTRY}/${IMAGE_NAME}"

      - name: Summarise
        run: |
          {
            echo "### \`${GITHUB_REF_NAME}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ steps.channel.outputs.version }}\` |"
            echo "| prerelease | \`${{ steps.channel.outputs.prerelease }}\` |"
            echo "| takes \`:latest\` | \`${{ steps.channel.outputs.latest }}\` |"
            echo "| takes \`:latest-beta\` | \`${{ steps.channel.outputs.latest_beta }}\` |"
            echo
            echo '```'
            echo "${{ steps.channel.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # One build, many tags: build-push-action pushes the same image
      # digest under each, so :latest and :0.0.44 are literally the same
      # bytes and cannot drift.
      - name: Build and push the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.channel.outputs.tags }}
          build-args: |
            BSFCHAT_SERVER_VERSION=${{ steps.channel.outputs.version }}
            BSFCHAT_SERVER_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.channel.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors the client's release job: the GitHub Release's `prerelease`
      # boolean is the authority for what is a beta, never the tag text.
      # The desktop updater filters on exactly this flag, and GitHub itself
      # excludes a prerelease from /releases/latest.
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          body: |
            Container image:

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.channel.outputs.version }}
            ```

            Published tags:

            ```
            ${{ steps.channel.outputs.tags }}
            ```

            See [docs/release-channels.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/release-channels.md)
            for what `:latest` and `:latest-beta` mean.
