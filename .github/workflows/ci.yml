name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bsfchat/server

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      # One configuration failing should not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            # -Wall -Wextra only. Deliberately NOT -Werror: several people
            # work in this tree at once and a warning introduced in one
            # branch must not block everyone else's builds. Warnings show up
            # as GitHub annotations on the diff, which is the point.
            cxx_flags: "-Wall -Wextra"
          - name: debug
            build_type: Debug
            cxx_flags: "-Wall -Wextra"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      - name: Build
        run: cmake --build build -j$(nproc)

      # -j: gtest_discover_tests registers every case as its own ctest
      # test, so this is also the check that fixtures stay parallel-safe
      # (unique temp dirs, ephemeral ports). Serial would hide a
      # regression back to shared paths.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsqlite3-dev

      - name: Configure
        # -fno-omit-frame-pointer keeps the stack traces readable; -O1 keeps
        # the sanitized test run from taking all afternoon.
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure -j$(nproc)

  analyze:
    name: cppcheck
    runs-on: ubuntu-24.04
    # Advisory only for now — this is a new check against an existing
    # codebase, so it reports rather than gates. Tighten once the backlog it
    # surfaces has been worked through.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --std=c++20 \
                   --error-exitcode=1 \
                   -I src \
                   src/

  docker:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # Always add :latest on a push to main. The previous
            # `{{is_default_branch}}` template evaluated to false on
            # some runs, so prod was stuck on a stale image until
            # someone manually retagged. GitHub Actions context is
            # deterministic here.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
